---
# Primary inventory: run from the Alpine ops-node VM, which reaches the trading
# node (the laptop, bare metal) over the VirtualBox host-only network. This is
# the "real control node manages a separate trading node" path.
all:
  children:
    trading_nodes:
      hosts:
        trading-node:
          ansible_host: 192.168.56.1     # the laptop on vboxnet0 (host-only)
          ansible_port: 22
          ansible_user: abhayps          # real login on the laptop
          ansible_connection: ssh
