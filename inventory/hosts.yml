---
# Remote inventory: run the playbook from a separate control host, reaching the
# trading node over SSH — the "control node manages a separate trading node"
# story. Edit ansible_host / ansible_user for your setup. To run on the node
# itself instead, use inventory/local.yml.
all:
  children:
    trading_nodes:
      hosts:
        trading-node:
          ansible_host: 10.0.0.10        # <-- the trading node's IP/hostname
          ansible_port: 22
          ansible_user: abhayps          # <-- login on the trading node
          ansible_connection: ssh
