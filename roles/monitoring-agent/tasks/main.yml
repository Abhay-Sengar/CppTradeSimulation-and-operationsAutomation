---
# Install Netdata from the Ubuntu archive. This replaces the upstream static
# kickstart, which silently failed on this box (exited 0 but produced no
# binary — a flaky remote tarball download). The apt package is reliable, binds
# localhost by default, and puts config under /etc/netdata.
- name: Install Netdata (Ubuntu package)
  ansible.builtin.apt:
    name: netdata
    state: present
    update_cache: false

- name: Configure Netdata web binding + per-core CPU (override file)
  # netdata.conf is override-only: unspecified keys fall back to built-in
  # defaults, so a minimal file is valid and safe.
  ansible.builtin.template:
    src: netdata.conf.j2
    dest: "{{ monitoring_netdata_conf }}"
    mode: "0644"
  notify: Restart netdata

- name: Install the trade-metrics netdata plugin
  # A tiny external plugin that scrapes the engine's :8000/metrics and charts
  # t2t/rtt/orders natively — so the latency shows on the dashboard even though
  # the Ubuntu netdata package ships no go.d Prometheus collector. Netdata runs
  # every executable in plugins.d automatically.
  ansible.builtin.copy:
    src: trade-metrics.plugin
    dest: /usr/lib/netdata/plugins.d/trade-metrics.plugin
    mode: "0755"
  notify: Restart netdata

- name: Ensure Netdata is running
  ansible.builtin.systemd:
    name: netdata
    state: started
    enabled: true
