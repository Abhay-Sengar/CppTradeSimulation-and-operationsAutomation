---
- name: Download Netdata kickstart installer
  ansible.builtin.get_url:
    url: https://get.netdata.cloud/kickstart.sh
    dest: /tmp/netdata-kickstart.sh
    mode: "0755"
    force: false

- name: Install Netdata (self-contained static build, works on any distro)
  ansible.builtin.command: >
    sh /tmp/netdata-kickstart.sh
    --static-only --non-interactive --stable-channel
    --disable-telemetry --no-updates
  args:
    creates: /opt/netdata/usr/sbin/netdata

- name: Configure Netdata web binding for port-forward access
  ansible.builtin.template:
    src: netdata.conf.j2
    dest: "{{ monitoring_netdata_conf }}"
    mode: "0644"
  notify: Restart netdata

- name: Ensure Netdata is running
  ansible.builtin.systemd:
    name: netdata
    state: started
    enabled: true
