---
- name: Install the C++ build toolchain
  ansible.builtin.apt:
    name:
      - build-essential
      - cmake
    state: present
    update_cache: false

- name: Create the trading service user
  ansible.builtin.user:
    name: "{{ trading_app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create the app and source directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ trading_app_dir }}"
    - "{{ trading_app_dir }}/bin"
    - "{{ trading_src_dir }}"

- name: Sync the C++ sources to the node
  ansible.builtin.copy:
    src: cpp/
    dest: "{{ trading_src_dir }}/"
    mode: preserve
  register: trading_src_sync

- name: Configure the C++ build (CMake, Release)
  ansible.builtin.command:
    cmd: cmake -S {{ trading_src_dir }} -B {{ trading_src_dir }}/build -DCMAKE_BUILD_TYPE=Release
    creates: "{{ trading_src_dir }}/build/CMakeCache.txt"

- name: Compile the trading engine and mock exchange
  ansible.builtin.command:
    cmd: cmake --build {{ trading_src_dir }}/build -j
  register: trading_build
  changed_when: "'Built target' in trading_build.stdout"

- name: Install the built binaries
  ansible.builtin.copy:
    src: "{{ trading_src_dir }}/build/{{ item }}"
    dest: "{{ trading_app_dir }}/bin/{{ item }}"
    mode: "0755"
    remote_src: true
  loop:
    - trading_engine
    - mock_exchange
  notify:
    - Restart mock exchange
    - Restart trading engine

- name: Own the app tree as the service user
  ansible.builtin.file:
    path: /opt/trade-ops
    state: directory
    owner: "{{ trading_app_user }}"
    group: "{{ trading_app_user }}"
    recurse: true

- name: Install mock exchange systemd unit
  ansible.builtin.template:
    src: mock-exchange.service.j2
    dest: /etc/systemd/system/mock-exchange.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart mock exchange

- name: Install trading engine systemd unit
  ansible.builtin.template:
    src: trading-engine.service.j2
    dest: /etc/systemd/system/trading-engine.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart trading engine

- name: Ensure Netdata go.d directory exists
  ansible.builtin.file:
    path: /etc/netdata/go.d
    state: directory
    mode: "0755"

- name: Tell Netdata to scrape the engine's metrics
  ansible.builtin.copy:
    content: |
      jobs:
        - name: trading_engine
          url: http://127.0.0.1:{{ trading_metrics_port }}/metrics
    dest: /etc/netdata/go.d/prometheus.conf
    mode: "0644"
  notify: Restart netdata

- name: Enable and start the trading services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - mock-exchange
    - trading-engine
  when: not ansible_check_mode
