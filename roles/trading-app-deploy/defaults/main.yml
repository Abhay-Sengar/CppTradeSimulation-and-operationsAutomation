---
trading_app_dir: /opt/trade-ops/app
trading_src_dir: /opt/trade-ops/src
trading_app_user: trader
trading_metrics_port: 8000
trading_exchange_port: 9001

# One hot thread pinned per physical isolated core (siblings offline).
trading_md_cpu: 8
trading_strategy_cpu: 10
trading_gateway_cpu: 12
trading_exchange_cpu: 14
trading_rt_prio: 80

# Runtime engine A/B toggles — the systemd unit passes these; flip them for the
# demo (no rebuild needed). dispatch: crtp|virtual, alloc: pool|malloc, huge: on|off.
trading_dispatch: crtp
trading_alloc: pool
trading_huge: "on"
trading_rate: 2000        # synthetic ticks per second
