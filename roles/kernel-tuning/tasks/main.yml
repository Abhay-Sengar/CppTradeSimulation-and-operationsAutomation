---
- name: Apply low-latency sysctl parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-trade-ops.conf
    sysctl_set: true
    reload: true
    state: present
  loop: "{{ kernel_tuning_sysctls | dict2items }}"

- name: Apply best-effort sysctls (skip if key absent in this kernel/VM)
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-trade-ops.conf
    sysctl_set: true
    reload: true
    state: present
  loop: "{{ kernel_tuning_sysctls_best_effort | dict2items }}"
  failed_when: false

- name: Configure CPU-isolation parameters on the kernel command line
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="{{ kernel_tuning_cmdline_params | join(" ") }}"'
    backup: true
  notify:
    - Update grub
    - Reboot required

- name: Keep every systemd-spawned service off the isolated cores by default
  # The trading units override this with their own CPUAffinity; isolcpus also
  # keeps non-pinned tasks (VirtualBox, etc.) off 8-11. Belt and suspenders.
  ansible.builtin.lineinfile:
    path: /etc/systemd/system.conf
    regexp: '^#?\s*CPUAffinity='
    line: 'CPUAffinity={{ kernel_tuning_housekeeping_cpus }}'
    backup: true
  notify: Reboot required

# ---- CPU tuning applied at boot AND immediately, reversibly ----------------
- name: Install the CPU-tuning script
  ansible.builtin.copy:
    src: trade-ops-cpu-tuning.sh
    dest: /usr/local/sbin/trade-ops-cpu-tuning.sh
    mode: "0755"

- name: Ensure the trade-ops config directory exists
  ansible.builtin.file:
    path: /etc/trade-ops
    state: directory
    mode: "0755"

- name: Install the CPU-tuning config
  ansible.builtin.template:
    src: cpu-tuning.conf.j2
    dest: /etc/trade-ops/cpu-tuning.conf
    mode: "0644"

- name: Install and enable the trade-ops-cpu boot unit
  ansible.builtin.template:
    src: trade-ops-cpu.service.j2
    dest: /etc/systemd/system/trade-ops-cpu.service
    mode: "0644"

- name: Enable trade-ops-cpu.service (offlines siblings + governor at every boot)
  ansible.builtin.systemd:
    name: trade-ops-cpu.service
    enabled: true
    daemon_reload: true

- name: Apply CPU tuning now (immediate + reversible; no reboot needed for this part)
  ansible.builtin.command: /usr/local/sbin/trade-ops-cpu-tuning.sh
  register: kernel_tuning_cpu_now
  changed_when: true
  when: not ansible_check_mode

- name: Show CPU-tuning output
  ansible.builtin.debug:
    var: kernel_tuning_cpu_now.stdout_lines
  when: not ansible_check_mode

- name: Collect service facts
  ansible.builtin.service_facts:

- name: Disable irqbalance so IRQs are not migrated onto isolated cores
  ansible.builtin.systemd:
    name: irqbalance
    state: stopped
    enabled: false
  when: "'irqbalance.service' in ansible_facts.services"

# ---- IRQ affinity: pin device IRQs to housekeeping cores --------------------
# Uses smp_affinity_LIST (accepts "0-7" directly) instead of a hex mask — the
# old hex-mask math was doubly wrong (int() on a range string, and pow(cpu,2)
# instead of 2**cpu, which silently dropped cpu0). The list form is exact.
- name: Pin device IRQ affinity to housekeeping cores (best-effort)
  ansible.builtin.shell: |
    set -eo pipefail
    changed=0
    for irq_dir in /proc/irq/[0-9]*; do
      aff="$irq_dir/smp_affinity_list"
      [ -w "$aff" ] || continue
      before=$(cat "$aff" 2>/dev/null || echo "")
      echo "{{ kernel_tuning_housekeeping_cpus }}" > "$aff" 2>/dev/null || true
      after=$(cat "$aff" 2>/dev/null || echo "")
      [ "$before" != "$after" ] && changed=1
    done
    echo "irq_affinity_changed=$changed"
  args:
    executable: /bin/bash
  register: kernel_tuning_irq_pin
  changed_when: "'irq_affinity_changed=1' in kernel_tuning_irq_pin.stdout"
  failed_when: false

- name: Report IRQ-pinning outcome
  ansible.builtin.debug:
    msg: >-
      Pinned writable device IRQs to housekeeping cores
      ({{ kernel_tuning_housekeeping_cpus }}).
      {% if 'irq_affinity_changed=1' in (kernel_tuning_irq_pin.stdout | default('')) %}
      At least one IRQ's affinity was updated.
      {% else %}
      No IRQ affinity changed — some IRQs (e.g. per-CPU timers) are not
      re-routable; the boot-time irqaffinity=0-7 cmdline param covers the rest.
      {% endif %}

- name: Read effective kernel command line
  ansible.builtin.command: cat /proc/cmdline
  register: cmdline_now
  changed_when: false

- name: Show current kernel command line (reflects new params only AFTER reboot)
  ansible.builtin.debug:
    var: cmdline_now.stdout

- name: Detect the kernel preemption model (knowledge demonstration only)
  # Do NOT test with `[ -r ... ]` first: on a Secure Boot machine the kernel runs
  # in lockdown 'integrity' mode (/sys/kernel/security/lockdown), which denies
  # debugfs reads even to root. The mode bits say readable, so `[ -r ]` passes,
  # and then the read itself returns EPERM — which used to abort this task and,
  # because a failed host is dropped from the play, silently stranded the
  # `Update grub` handler (the play also sets force_handlers now). Attempt the
  # read and fall back on failure instead of predicting permission.
  ansible.builtin.shell: |
    set -o pipefail
    if preempt=$(cat /sys/kernel/debug/sched/preempt 2>/dev/null); then
      echo "$preempt"
    else
      echo "debugfs unreadable (Secure Boot lockdown: $(cat /sys/kernel/security/lockdown 2>/dev/null || echo n/a))"
      grep -o 'PREEMPT[_A-Z]*' /proc/version | head -1 || echo "unknown"
    fi
  args:
    executable: /bin/bash
  register: kernel_tuning_preempt
  changed_when: false
  check_mode: false
  # Purely informational — it must never gate a converge.
  failed_when: false

- name: Report preemption model and the bare-metal real-time path
  ansible.builtin.debug:
    msg: >-
      Kernel preemption model: {{ kernel_tuning_preempt.stdout | trim }}.
      For lowest latency on a colo box you would boot a PREEMPT_RT kernel (sleeping
      spinlocks, threaded IRQs) or set preempt=full via PREEMPT_DYNAMIC — out of scope
      here, where the goal is to show the tuning workflow rather than achieve RT numbers.
