---
- name: Apply low-latency sysctl parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-trade-ops.conf
    sysctl_set: true
    reload: true
    state: present
  loop: "{{ kernel_tuning_sysctls | dict2items }}"

- name: Apply best-effort sysctls (skip if key absent in this kernel/VM)
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-trade-ops.conf
    sysctl_set: true
    reload: true
    state: present
  loop: "{{ kernel_tuning_sysctls_best_effort | dict2items }}"
  failed_when: false

- name: Configure CPU-isolation parameters on the kernel command line
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="{{ kernel_tuning_cmdline_params | join(" ") }}"'
    backup: true
  notify:
    - Update grub
    - Reboot required

- name: Check whether the CPU frequency governor is exposed
  ansible.builtin.stat:
    path: /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor
  register: cpufreq_stat

- name: Set CPU governor to performance (only if cpufreq is available)
  ansible.builtin.shell: |
    for g in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
      echo performance > "$g"
    done
  when: cpufreq_stat.stat.exists
  changed_when: true

- name: Note that cpufreq is not exposed (expected inside a VM)
  ansible.builtin.debug:
    msg: >-
      cpufreq/scaling_governor not present — governor control is a bare-metal/BIOS
      step. Skipping (expected in VirtualBox).
  when: not cpufreq_stat.stat.exists

- name: Collect service facts
  ansible.builtin.service_facts:

- name: Disable irqbalance so IRQs are not migrated onto isolated cores
  ansible.builtin.systemd:
    name: irqbalance
    state: stopped
    enabled: false
  when: "'irqbalance.service' in ansible_facts.services"

- name: Read effective kernel command line
  ansible.builtin.command: cat /proc/cmdline
  register: cmdline_now
  changed_when: false

- name: Show current kernel command line (reflects new params only AFTER reboot)
  ansible.builtin.debug:
    var: cmdline_now.stdout

- name: Build the housekeeping CPU mask (all cores except the isolated one)
  ansible.builtin.set_fact:
    kernel_tuning_housekeeping_mask: >-
      {{
        '%x' % (
          range(ansible_processor_vcpus | default(1) | int)
          | difference([kernel_tuning_isolated_cpus | default(0) | int])
          | map('pow', 2)
          | map('int')
          | sum
        )
      }}

- name: Pin device IRQ affinity to housekeeping cores (best-effort; often a no-op in a VM)
  ansible.builtin.shell: |
    set -eo pipefail
    changed=0
    for irq_dir in /proc/irq/[0-9]*; do
      irq=$(basename "$irq_dir")
      aff="$irq_dir/smp_affinity"
      [ -w "$aff" ] || continue
      before=$(cat "$aff" 2>/dev/null | tr -d ',' | sed 's/^0*//')
      echo "{{ kernel_tuning_housekeeping_mask }}" > "$aff" 2>/dev/null || true
      after=$(cat "$aff" 2>/dev/null | tr -d ',' | sed 's/^0*//')
      [ "$before" != "$after" ] && changed=1
    done
    echo "irq_affinity_changed=$changed"
  register: kernel_tuning_irq_pin
  changed_when: "'irq_affinity_changed=1' in kernel_tuning_irq_pin.stdout"
  failed_when: false

- name: Report IRQ-pinning outcome (honest about VM limits)
  ansible.builtin.debug:
    msg: >-
      Attempted to pin device IRQs to housekeeping cores (mask
      0x{{ kernel_tuning_housekeeping_mask }}).
      {% if 'irq_affinity_changed=1' in (kernel_tuning_irq_pin.stdout | default('')) %}
      At least one IRQ's affinity was updated.
      {% else %}
      No IRQ affinity changed — expected inside VirtualBox, whose virtual IRQ
      controller usually ignores smp_affinity writes. On bare metal with a
      multi-queue NIC these writes move each queue's IRQ onto a housekeeping core.
      {% endif %}

- name: Detect the kernel preemption model (knowledge demonstration only)
  ansible.builtin.shell: |
    set -o pipefail
    if [ -r /sys/kernel/debug/sched/preempt ]; then
      cat /sys/kernel/debug/sched/preempt
    else
      grep -o 'PREEMPT[_A-Z]*' /proc/version | head -1 || echo "unknown"
    fi
  register: kernel_tuning_preempt
  changed_when: false
  check_mode: false

- name: Report preemption model and the bare-metal real-time path
  ansible.builtin.debug:
    msg: >-
      Kernel preemption model: {{ kernel_tuning_preempt.stdout | trim }}.
      For lowest latency on a colo box you would boot a PREEMPT_RT kernel (sleeping
      spinlocks, threaded IRQs) or set preempt=full via PREEMPT_DYNAMIC — out of scope
      here, where the goal is to show the tuning workflow rather than achieve RT numbers.
