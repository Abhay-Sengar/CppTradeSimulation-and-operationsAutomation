---
- name: Update grub
  ansible.builtin.command: update-grub
  changed_when: true

- name: Reboot required
  ansible.builtin.debug:
    msg: >-
      GRUB cmdline and/or /etc/systemd/system.conf changed on the trading node.
      Reboot the trading node ('sudo reboot') to activate isolcpus / nohz_full /
      hugepages / global CPUAffinity, then verify with /proc/cmdline and
      'lscpu -e'. The control node (Alpine VM) does not need rebooting.
