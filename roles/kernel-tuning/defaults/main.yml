---
# Core map for a HYBRID Intel i7-1255U (Alder Lake-U, 12 logical CPUs):
#   cpu0,1   P-core 0  (HT siblings)         4.7 GHz
#   cpu2,3   P-core 1  (HT siblings)         4.7 GHz
#   cpu4-7   E-cores, no HT, L2 cluster A    3.5 GHz
#   cpu8-11  E-cores, no HT, L2 cluster B    3.5 GHz
#
# We isolate the four E-cores of cluster B (8-11) and pin one hot thread each:
# market-data=8, strategy=9, gateway=10, exchange=11. They SHARE AN L2, so the
# SPSC ring hand-offs between hops stay L2-local instead of going out to L3.
# cpu0 stays housekeeping on purpose — it is the boot CPU and nohz_full must
# exclude it (the kernel needs a timekeeping CPU).
#
# SMT-sibling offlining is topology-dependent, and on this box it MOVES: the hot
# cores are E-cores, which have no SMT sibling to contend with, so there is
# nothing to offline there. Instead we offline cpu1 and cpu3 — the HT siblings
# of the two P-cores — so the process's NON-hot threads (logger, metrics-HTTP,
# main) and netdata run on full physical P-cores with no hyper-thread
# contention. (Previous hardware: Ryzen 7 7730U, 16 threads, isolated 8-15 with
# hot threads on 8/10/12/14 and siblings 9/11/13/15 offlined.)
kernel_tuning_isolated_cpus: "8-11"          # string form for the kernel cmdline
kernel_tuning_isolated_list: [8, 9, 10, 11]  # list form for filters
kernel_tuning_offline_siblings: [1, 3]       # HT siblings of the housekeeping P-cores
kernel_tuning_housekeeping_cpus: "0-7"        # everything non-hot runs here (1,3 offlined)

# Explicit 2 MB huge pages, reserved on the kernel command line (most reliable —
# reserved at boot before memory fragments). 512 * 2 MB = 1 GB, ample on 15 GB.
kernel_tuning_hugepages_count: 512

# CPU governor + turbo policy, applied at boot by trade-ops-cpu.service and also
# once immediately by the role. Turbo/boost stays ON for a lively demo; set
# kernel_tuning_disable_turbo: true for benchmark-stable (lower-variance) numbers.
kernel_tuning_governor: performance
kernel_tuning_disable_turbo: false

# Parameters appended to the kernel command line (take effect after reboot).
#   isolcpus     - keep the scheduler from placing normal tasks on 8-11
#   nohz_full    - stop the 1kHz scheduler tick on those cores (needs rcu_nocbs)
#   rcu_nocbs    - offload RCU callback processing to housekeeping cores
#   irqaffinity  - route IRQs to housekeeping cores 0-7 from boot
#   transparent_hugepage=never - use explicit huge pages, not THP (no khugepaged jitter)
#   default_hugepagesz/hugepagesz/hugepages - reserve the 2 MB pool early
kernel_tuning_cmdline_params:
  - "isolcpus={{ kernel_tuning_isolated_cpus }}"
  - "nohz_full={{ kernel_tuning_isolated_cpus }}"
  - "rcu_nocbs={{ kernel_tuning_isolated_cpus }}"
  - "irqaffinity={{ kernel_tuning_housekeeping_cpus }}"
  - "transparent_hugepage=never"
  - "default_hugepagesz=2M"
  - "hugepagesz=2M"
  - "hugepages={{ kernel_tuning_hugepages_count }}"

# Keys that exist on essentially every kernel — safe to set hard.
kernel_tuning_sysctls:
  vm.swappiness: "10"
  vm.stat_interval: "120"
  # Disable RT bandwidth throttling. By default the kernel throttles SCHED_FIFO
  # to 95% (a ~50ms stall every 1s) so normal tasks can run. On an isolated core
  # that runs ONLY its one pinned FIFO hot thread, that stall is pure tail
  # latency — so we let FIFO run 100%. Safe here because nothing else is
  # scheduled on the isolated cores and housekeeping (0-7) is untouched.
  kernel.sched_rt_runtime_us: "-1"
  vm.nr_hugepages: "{{ kernel_tuning_hugepages_count }}"
  net.core.rmem_max: "16777216"
  net.core.wmem_max: "16777216"
  net.core.netdev_max_backlog: "5000"
  net.core.busy_poll: "50"
  net.core.busy_read: "50"
  net.ipv4.tcp_fastopen: "3"

# Keys that may be absent depending on kernel config / VM — best-effort.
kernel_tuning_sysctls_best_effort:
  kernel.numa_balancing: "0"
  kernel.timer_migration: "0"
